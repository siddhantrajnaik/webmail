services:
  - type: web
    name: iitd-mail-api
    runtime: node
    plan: free
    buildCommand: npm run build && cd server && npm install && npm run build && cp -r ../dist dist/public
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: VITE_API_BASE
        value: https://webmail-1.onrender.com
      - key: CORS_ORIGIN
        value: https://siddhantrajnaik.github.io
    autoDeploy: true
