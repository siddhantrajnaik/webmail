services:
  - type: web
    name: iitd-mail-api
    runtime: node
    plan: free
    buildCommand: npm run build && cd server && npm install && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
    autoDeploy: true
